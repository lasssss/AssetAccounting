<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#4472C4">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <title>{% block title %}Учёт ОС{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f7fa; }
    .card { box-shadow: 0 1px 3px rgba(0,0,0,.08); border: none; }
    .table th { background: #f0f2f5; }
    .breadcrumb { background: none; padding: 0; margin-bottom: 1rem; }
    .ro-star { color: #dc3545; font-weight: bold; margin-left: 2px; }
  </style>
</head>
<body>
  <div class="container-fluid py-3 px-4">
    {% for cat, msg in get_flashed_messages(with_categories=true) %}
      <div class="alert alert-{{ cat }} alert-dismissible fade show">{{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js');
    }
  </script>
  {% block styles %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
